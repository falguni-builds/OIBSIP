<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>🌡️ Temperature Converter</h2>
        <label>Enter Temperature</label>
        <input
            type="number"
            id="temp"
            placeholder="Enter temperature"
        >
        <label>Select Unit</label>
        <select id="unit">

            <option value="">Select Unit</option>

            <option value="c">Celsius</option>

            <option value="f">Fahrenheit</option>

            <option value="k">Kelvin</option>
        </select>
        <div class="buttons">

            <button onclick="convtemp()">
                Convert
            </button>
            <button class="reset-btn" onclick="resetConverter()">
                Reset
            </button>
        </div>
        <p id="error"></p>
        <div id="result">
            <div class="result-box">
                <h3>🌡️ Celsius</h3>
                <p id="celsius">-- °C</p>
            </div>
            <div class="result-box">
                <h3>🌡️ Fahrenheit</h3>
                <p id="fahrenheit">-- °F</p>
            </div>
            <div class="result-box">

                <h3>🌡️ Kelvin</h3>

                <p id="kelvin">-- K</p>
            </div>
        </div>
        <div id="status">
            <h3>🌡️ Temperature Status</h3>

            <p id="status-text">
                --
            </p>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
